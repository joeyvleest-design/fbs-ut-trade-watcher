name: Refresh official FBS news and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Separate UTC candidates preserve the intended run time even when Actions is
  # delayed. The worker applies Amsterdam DST and skips the other candidate.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "1 17 * * 0,3,5"
    - cron: "1 18 * * 0,3,5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Refresh from official EA Press RSS when due
        id: refresh
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 scripts/refresh_official_rss.py --site-root . --preserve-published --allow-source-failure --scheduled --scheduled-cron "$SCHEDULE_CRON" --post-discord
          else
            python3 scripts/refresh_official_rss.py --site-root . --preserve-published --allow-source-failure
          fi

      - name: Build a public-only Pages artifact
        if: steps.refresh.outputs.deploy == 'true'
        shell: bash
        run: |
          site_root="."
          if [ -f site/index.html ]; then
            site_root="site"
          fi
          mkdir -p _site
          cp "$site_root"/.nojekyll "$site_root"/app.js "$site_root"/discord.html "$site_root"/discord.js "$site_root"/favicon.svg "$site_root"/index.html "$site_root"/logo.svg "$site_root"/news.html "$site_root"/news.js "$site_root"/styles.css _site/
          cp "$site_root"/refresh.js "$site_root"/card-art.js "$site_root"/dashboard.css "$site_root"/motion.js "$site_root"/discord-page.css _site/
          cp -R "$site_root"/assets _site/assets
          cp -R "$site_root"/data _site/data

      - uses: actions/configure-pages@v5
        if: steps.refresh.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.refresh.outputs.deploy == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.refresh.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
