name: Refresh official FBS news and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Send one labelled Discord connection test (no market advice or data refresh)"
        required: false
        default: false
        type: boolean
  # Separate UTC candidates preserve the intended run time even when Actions is
  # delayed. The worker applies Amsterdam DST and skips the other candidate.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "1 17 * * 0,3,5"
    - cron: "1 18 * * 0,3,5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Refresh from official EA Press RSS when due
        id: refresh
        if: ${{ !inputs.test_discord }}
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 scripts/refresh_official_rss.py --site-root . --preserve-published --allow-source-failure --scheduled --scheduled-cron "$SCHEDULE_CRON" --prepare-discord
          else
            python3 scripts/refresh_official_rss.py --site-root . --preserve-published --allow-source-failure
          fi

      - name: Publish an honest daily trade assessment and check squad coverage
        if: steps.refresh.outputs.deploy == 'true'
        run: python3 scripts/daily_watch.py --site-root .

      - name: Build a public-only Pages artifact
        if: steps.refresh.outputs.deploy == 'true'
        shell: bash
        run: |
          site_root="."
          if [ -f site/index.html ]; then
            site_root="site"
          fi
          mkdir -p _site
          cp "$site_root"/.nojekyll "$site_root"/app.js "$site_root"/discord.html "$site_root"/discord.js "$site_root"/favicon.svg "$site_root"/index.html "$site_root"/logo.svg "$site_root"/news.html "$site_root"/news.js "$site_root"/styles.css _site/
          cp "$site_root"/refresh.js "$site_root"/card-art.js "$site_root"/dashboard.css "$site_root"/motion.js "$site_root"/discord-page.css "$site_root"/watch.js _site/
          cp -R "$site_root"/assets _site/assets
          cp -R "$site_root"/data _site/data

      - uses: actions/configure-pages@v5
        if: steps.refresh.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.refresh.outputs.deploy == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.refresh.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      - name: Send the prepared article only after publication
        if: steps.deployment.outcome == 'success' && steps.refresh.outputs.discord_delivery_id != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DELIVERY_ID: ${{ steps.refresh.outputs.discord_delivery_id }}
        run: python3 scripts/refresh_official_rss.py --site-root _site --deliver-discord "$DELIVERY_ID"

      - name: Keep the Discord delivery receipt
        if: always() && steps.refresh.outputs.discord_delivery_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: discord-delivery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/data/marketwatch.json
          retention-days: 14

      - name: Send one explicitly requested Discord connection test
        if: github.event_name == 'workflow_dispatch' && inputs.test_discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/refresh_official_rss.py --test-discord
